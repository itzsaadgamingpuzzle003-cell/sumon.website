<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samiul Islam</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#001f5c; /* Dark Blue */
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
}

/* Glowing Title */
h1{
    margin-top:40px;
    color:lime;
    font-size:70px;
    letter-spacing:5px;
    text-align:center;
    text-shadow:
        0 0 10px lime,
        0 0 20px lime,
        0 0 40px lime,
        0 0 60px lime,
        0 0 80px lime;
    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow{
    from{
        text-shadow:
            0 0 5px lime,
            0 0 10px lime,
            0 0 20px lime,
            0 0 30px lime;
    }
    to{
        text-shadow:
            0 0 15px lime,
            0 0 30px lime,
            0 0 60px lime,
            0 0 100px lime;
    }
}
</style>

</head>
<body>

<h1>Samiul Islam</h1>

</body>
</html>
